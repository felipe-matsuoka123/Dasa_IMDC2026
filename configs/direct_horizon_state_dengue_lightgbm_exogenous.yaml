experiment:
  name: direct_horizon_state_dengue_lgbm_exogenous

data:
  cases_path: data/dengue.csv.gz
  disease: dengue
  date_col: date
  target_col: casos
  group_cols:
    - uf_code
  exclude_uf:
    - ES
  target_city_only: false

direct_horizon:
  origin_week: 25
  target_start_week: 41
  target_end_week: 40
  target_length: 52
  min_origin_year: 2010
  validation_splits:
    validation_1:
      train_col: train_1
      target_col: target_1
    validation_2:
      train_col: train_2
      target_col: target_2
    validation_3:
      train_col: train_3
      target_col: target_3
    validation_4:
      train_col: train_4
      target_col: target_4

features:
  feature_sets:
    - calendar
    - case_lags
    - rolling_statistics
    - derivative_differences
    - derivative_accelerations
    - growth_ratios
    - rolling_slopes
    - direct_horizon_metadata
    - population
    - environment
    - climate_lags
    - ocean_lags
    - chikungunya_lags
    - afya_access_lags
  lags: [1, 2, 3, 4, 8, 12, 16, 26, 52]
  rolling_windows: [4, 8, 12, 26]
  differences: [1, 2, 4, 8]
  accelerations: [1, 2, 4]
  growth_windows: [4, 8, 12, 26]
  slope_windows: [4, 8, 12]
  missing_value: 0
  exogenous:
    enabled: true
    population:
      enabled: true
      path: data/datasus_population_2001_2025.csv.gz
    environment:
      enabled: true
      path: data/environ_vars.csv.gz
    climate:
      enabled: true
      path: data/climate.csv.gz
      variables: [temp_med, temp_min, temp_max, precip_med, rel_humid_med, rainy_days]
      lags: [1, 2, 4, 8, 12]
    ocean:
      enabled: true
      path: data/ocean_climate_oscillations.csv.gz
      variables: [enso, iod, pdo]
      lags: [1, 4, 8, 12, 26]
    chikungunya:
      enabled: true
      path: data/chikungunya.csv.gz
      lags: [1, 2, 4, 8, 12]
    afya:
      enabled: true
      path: data/access_afya_dengue_2021_2026.csv.gz
      accessed_disease: Dengue
      lags: [1, 2, 4, 8]

model:
  name: lightgbm
  params:
    objective: poisson
    n_estimators: 500
    learning_rate: 0.04
    num_leaves: 31
    min_child_samples: 25
    subsample: 0.9
    subsample_freq: 1
    colsample_bytree: 0.9
    reg_alpha: 0.05
    reg_lambda: 0.2
    random_state: 42
    n_jobs: -1
    verbosity: -1

wandb:
  entity: felipe-matsu-2003
  project: dengue-comp
  mode: offline

output:
  run_dir: outputs/runs
  direct_horizon_dir: outputs/direct_horizon_exogenous
