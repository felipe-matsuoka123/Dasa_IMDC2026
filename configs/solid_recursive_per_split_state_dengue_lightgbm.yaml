experiment:
  name: solid_recursive_per_split_state_dengue_lgbm
  validation_strategy: recursive_per_split

data:
  cases_path: data/dengue.csv.gz
  disease: dengue
  date_col: date
  target_col: casos
  group_cols:
    - uf_code
  exclude_uf:
    - ES
  target_city_only: false
  train_mask_cols:
    - train_3
  valid_mask_cols:
    - target_3

features:
  feature_sets:
    - calendar
    - case_lags
    - rolling_statistics
    - derivative_differences
    - derivative_accelerations
    - growth_ratios
    - rolling_slopes
    - population
    - environment
    - climate_lags
    - ocean_lags
    - chikungunya_lags
    - afya_access_lags
  lags: [1, 2, 3, 4, 8, 12, 16, 26, 52]
  rolling_windows: [4, 8, 12, 26]
  differences: [1, 2, 4, 8]
  accelerations: [1, 2, 4]
  growth_windows: [4, 8, 12, 26]
  slope_windows: [4, 8, 12]
  missing_value: 0
  exogenous:
    enabled: true
    population:
      enabled: true
      path: data/datasus_population_2001_2025.csv.gz
    environment:
      enabled: true
      path: data/environ_vars.csv.gz
    climate:
      enabled: true
      path: data/climate.csv.gz
      variables: [temp_med, temp_min, temp_max, precip_med, rel_humid_med, rainy_days]
      lags: [1, 2, 4, 8, 12]
    ocean:
      enabled: true
      path: data/ocean_climate_oscillations.csv.gz
      variables: [enso, iod, pdo]
      lags: [1, 4, 8, 12, 26]
    chikungunya:
      enabled: true
      path: data/chikungunya.csv.gz
      lags: [1, 2, 4, 8, 12]
    afya:
      enabled: true
      path: data/access_afya_dengue_2021_2026.csv.gz
      accessed_disease: Dengue
      lags: [1, 2, 4, 8]

model:
  name: lightgbm
  params:
    objective: poisson
    n_estimators: 800
    learning_rate: 0.03
    num_leaves: 31
    max_depth: -1
    min_child_samples: 30
    subsample: 0.85
    subsample_freq: 1
    colsample_bytree: 0.85
    reg_alpha: 0.05
    reg_lambda: 0.2
    random_state: 42
    n_jobs: -1
    verbosity: -1

wandb:
  entity: felipe-matsu-2003
  project: dengue-comp
  mode: online

output:
  run_dir: outputs/runs
  recursive_validation_dir: outputs/recursive_validation
